name: Release .flow packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flow-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .flow packages
        run: |
          mkdir -p dist
          for dir in flows/*/; do
            id=$(basename "$dir")
            (cd "$dir" && zip -qr "$OLDPWD/dist/$id.flow" .)
          done
          node .github/scripts/build-dist-index.mjs
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create dist --title "flow packages" \
            --notes "CI-built .flow packages; see dist/index.json for sha256." \
            dist/*.flow dist/index.json --repo qedmi/assistbox-flows \
            || gh release upload dist dist/*.flow dist/index.json --clobber --repo qedmi/assistbox-flows
